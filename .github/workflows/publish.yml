name: Publish

# Push a release tag like v0.4.0 → build, test, and publish to npm with OIDC.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify tag matches package version
        run: |
          node -e "const version=require('./package.json').version; const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v' + version) { console.error('Tag ' + tag + ' does not match package version ' + version); process.exit(1); }"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack release
        run: |
          filename=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          echo "PACKAGE_TARBALL=$RUNNER_TEMP/$filename" >> "$GITHUB_ENV"
      - name: Test the packed CLI and skill in a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/web-stylebook-smoke"
          cd "$RUNNER_TEMP/web-stylebook-smoke"
          npm init -y >/dev/null
          npm install "$PACKAGE_TARBALL"
          cli=./node_modules/.bin/web-stylebook-mcp
          "$cli" --version
          "$cli" --validate-catalog
          "$cli" call compose_design_tokens '{"primaryStyleId":"quiet-utility","contract":{"schema":"webstylebook.visual.v1"},"format":"json"}' > /dev/null
          test -f node_modules/web-stylebook-mcp/skills/web-stylebook-design/SKILL.md
      - run: npm publish "$PACKAGE_TARBALL" --access public
