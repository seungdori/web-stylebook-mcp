<!doctype html>
<html lang="en">
<body>
  <main>
    <section style="text-align: center; max-width: 420px; margin: 0 auto;">
      <p>Workspace</p>
      <h1>Sign in to Ledgerly</h1>
      <p>Use your work email to open the books for your company.</p>
      <form action="/session" method="post">
        <label for="email">Work email</label>
        <input id="email" type="email" name="email" autocomplete="email">
        <button type="submit">Continue</button>
      </form>
      <a href="/sso">Use single sign-on</a>
    </section>
  </main>
</body>
</html>
