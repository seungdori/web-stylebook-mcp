<!doctype html>
<html lang="en">
<body>
  <main>
    <section><h1>Rent camera gear by the day</h1><form><input type="date" name="from"><input type="date" name="to"><button>Check availability</button></form></section>
    <section>
      <h2>From the rental desk</h2>
      <div class="grid grid-cols-2 gap-8">
        <blockquote><p>“The FX3 came back with a clean sensor report and the battery log.”</p><cite>Order 20931, returned 3 June</cite></blockquote>
        <blockquote><p>“Pickup at 7 am worked for our sunrise shoot.”</p><cite>Order 21004, returned 9 June</cite></blockquote>
      </div>
    </section>
    <section>
      <h2>Lens kit</h2>
      <div class="carousel" aria-roledescription="carousel">
        <img src="/kit/24mm.jpg" alt="24mm f/1.4 lens" width="480" height="320">
        <img src="/kit/50mm.jpg" alt="50mm f/1.2 lens" width="480" height="320">
        <button aria-label="Previous">‹</button><button aria-label="Next">›</button>
      </div>
    </section>
  </main>
</body>
</html>
