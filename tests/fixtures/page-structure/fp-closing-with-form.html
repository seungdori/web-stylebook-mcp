<!doctype html>
<html lang="en">
<body>
  <main>
    <section><h1>Book a table for tonight</h1><img src="/dining-room-floor-plan.svg" alt="Floor plan with free tables" width="640" height="400"></section>
    <section><h2>Tonight's menu</h2><p>Seven courses, built around the morning's catch from Jagalchi market.</p></section>

      </form>
    </section>
  </main>

</html>
