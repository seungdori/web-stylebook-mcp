<!doctype html>
<html lang="en">
<body>
  <main>
    <section class="demo">
      <h1>Book a demo</h1>
      <p>Tell us about your team and we will show Ledgerly on your own bank data.</p>
      <form action="/demo/request" method="post" class="demo-form">

        <button type="submit">Request a demo</button>
      </form>
    </section>
  </main>
</body>
</html>
